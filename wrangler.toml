name = "mo-tax"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI — same binding + model (bge-large-en-v1.5) as Elle, so vectors
# land in the same 1024-dim space Atlas already queries.
[ai]
binding = "AI"

# Dedicated vector index for the tax corpus. Create it once:
#   wrangler vectorize create mo-tax-vectors --dimensions=1024 --metric=cosine
# Metadata indexes needed for entity filtering + the parent FK read path:
#   wrangler vectorize create-metadata-index mo-tax-vectors --property-name=parent_id     --type=string
#   wrangler vectorize create-metadata-index mo-tax-vectors --property-name=ent_llc_single --type=number
#   wrangler vectorize create-metadata-index mo-tax-vectors --property-name=ent_llc_multi  --type=number
#   wrangler vectorize create-metadata-index mo-tax-vectors --property-name=ent_s_corp     --type=number
#   wrangler vectorize create-metadata-index mo-tax-vectors --property-name=ent_general    --type=number
[[vectorize]]
binding = "VECTORIZE"
index_name = "mo-tax-vectors"

# Canonical verbatim statute store.
[[d1_databases]]
binding = "DB"
database_name = "mo-tax"
database_id = "e4b408dc-65b8-4e0d-9ad0-1948c4ef95c4"

# TAX_SERVICE_KEY guards /admin/ingest, /admin/verify, /admin/stats. Set it as
# a secret, never commit it:
#   wrangler secret put TAX_SERVICE_KEY

# Weekly database-management pass: re-checks the parent/child invariant
# against what's actually in D1, and re-fetches every plain-fetchable source
# (justia mirror + DOR guidance pages) to detect drift against the checksum
# recorded at the last local pull. Logs to ingestion_event either way -- see
# src/db-management.ts and the scheduled() handler in src/index.ts. Same
# result is available on demand via POST /admin/verify.
[triggers]
crons = ["0 13 * * 1"]  # Monday 13:00 UTC (08:00 America/Chicago) -- off business hours
